[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-pcapng"
description = "Library to read/write the pcap-ng format used by various packet sniffers."
dynamic = ["version"]
readme = "README.rst"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  { name = "Samuele Santi", email = "samuele@samuelesanti.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = [
    "flake8>=5.0.4",
    "isort>=5.13.2",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx>=7.1.2",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
packages = ["pcapng"]

[tool.hatch.build.targets.wheel]
packages = ["pcapng"]

[tool.black]
target-version = ['py35']

[tool.isort]
# These settings ensure that black and isort don't disagree on the imports.
line_length = 88
multi_line_output = 3
include_trailing_comma = true

known_first_party = ['pcapng']
known_third_party = ['pytest', 'scapy']
